[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tiganeval"
version = "0.1.0"
description = "Measuring outcome alignment of agents"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "openai>=1.30", "PyYAML>=6.0"]

[project.scripts]
tiganeval = "tiganeval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiganeval"]
